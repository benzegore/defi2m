<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Défi 2 minutes</title>
</head>
<body>
<title>Défi 2 minutes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: one centred column on a dotted sky; each screen (menu, jeu, résultat) swaps in place. Blue + electric yellow + capture red, wild creatures appear on grass. */
:root {
  --paper: #e6f2ff;
  --dot: #cfe2fb;
  --sheet: #ffffff;
  --ink: #1b2244;
  --muted: #56618a;
  --line: #c9d8f0;
  --pen: #2456c9;
  --pen-soft: #e0e9ff;
  --sun: #ffcb05;
  --red: #e0301e;
  --on-red: #ffffff;
  --red-soft: #fde4e1;
  --green: #23894a;
  --green-soft: #e0f4e6;
  --grass: #d9f2cf;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Andika", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111a33; --dot: #1b2747; --sheet: #1b2442; --ink: #eef2ff; --muted: #a3afd4; --line: #2e3a62;
    --pen: #8fb0ff; --pen-soft: #26335c; --sun: #ffd84a; --red: #ff6a55; --on-red: #1a0d0a; --red-soft: #3e2220;
    --green: #6bd48f; --green-soft: #1b3527; --grass: #1f3a28; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111a33; --dot: #1b2747; --sheet: #1b2442; --ink: #eef2ff; --muted: #a3afd4; --line: #2e3a62;
  --pen: #8fb0ff; --pen-soft: #26335c; --sun: #ffd84a; --red: #ff6a55; --on-red: #1a0d0a; --red-soft: #3e2220;
  --green: #6bd48f; --green-soft: #1b3527; --grass: #1f3a28; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px); background-size: 24px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(2rem, 6vw, 2.8rem); font-weight: 800; }
h1 { color: var(--pen); }
h1 span { color: var(--sun); -webkit-text-stroke: 3px var(--pen); paint-order: stroke fill; }
.lead { color: var(--muted); margin: 4px 0 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--pen); outline-offset: 2px; }

/* Menu */
.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 16px; }
/* « Calcul mental + » juste sous « Calcul mental », dans la première colonne */
#go-calc { grid-column: 1; grid-row: 1; }
#go-plus { grid-column: 1; grid-row: 2; }
@media (max-width: 600px) {
  .modes { grid-template-columns: 1fr; }
  #go-calc, #go-plus { grid-column: auto; grid-row: auto; }
}
.mode {
  text-align: left; background: var(--sheet); border: 2px solid var(--line); border-top: 8px solid var(--sun); border-radius: 14px; padding: 18px;
  display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s;
}
.mode:hover { border-color: var(--pen); transform: translateY(-2px); }
.mode h2 { font-size: 1.5rem; }
.mode .ex { font-size: 1.15rem; color: var(--pen); font-variant-numeric: tabular-nums; }
.mode p { margin: 0; color: var(--muted); }
.mode .best { font-size: .9rem; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 8px; }
.mode .go { align-self: flex-start; background: var(--red); color: var(--on-red); border-radius: 999px; padding: 6px 16px; font-weight: 700; }
.belts { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.belts h3 { font-size: 1.1rem; }
.belt-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.belt-chip { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.belt-chip small { color: var(--muted); font-variant-numeric: tabular-nums; }
.sw { width: 34px; height: 12px; border-radius: 3px; border: 1px solid var(--muted); flex: none; }

/* Game header */
.bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.timer { position: relative; width: 74px; height: 74px; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 8; }
.timer .track { stroke: var(--line); }
.timer .prog { stroke: var(--pen); stroke-linecap: round; transition: stroke .3s; }
.timer.low .prog { stroke: var(--red); }
.timer b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.bar .info { flex: 1; min-width: 0; }
.bar .info h2 { font-size: 1.3rem; }
.bar .info div { color: var(--muted); font-variant-numeric: tabular-nums; }
.ghost { background: transparent; border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; color: var(--muted); }
.ghost:hover { border-color: var(--red); color: var(--red); }

/* Calcul mental */
.card { background: var(--sheet); border: 2px solid var(--line); border-radius: 18px; padding: 22px 18px; display: flex; flex-direction: column; align-items: center; gap: 18px; transition: background .15s, border-color .15s; }
.card.ok { border-color: var(--green); background: var(--green-soft); }
.card.ko { border-color: var(--red); background: var(--red-soft); }
.calc { font-family: var(--font-display); font-weight: 800; font-size: clamp(2.6rem, 11vw, 4.2rem); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: .3em; flex-wrap: wrap; justify-content: center; }
.answer { min-width: 2.2em; text-align: center; color: var(--pen); border-bottom: 4px solid var(--pen); padding: 0 .1em; }
.answer:empty::after { content: "?"; color: var(--line); }
.fix { color: var(--red); font-size: .5em; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; }
.pad button { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; padding: 10px 0; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); font-variant-numeric: tabular-nums; }
.pad button:active { transform: scale(.96); }
.pad .del { color: var(--muted); font-size: 1.2rem; }
.pad .ok-btn { background: var(--pen); color: var(--sheet); border-color: var(--pen); font-size: 1.3rem; }
.hint { color: var(--muted); font-size: .85rem; text-align: center; margin: 0; }

/* Numération */
.q { font-family: var(--font-display); font-size: 1.35rem; text-align: center; }
.scene { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; justify-content: center; width: 100%; }
.groups { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; justify-content: center; }
.singles { display: grid; grid-template-columns: repeat(5, auto); gap: 5px; padding: 8px; border: 2px dashed var(--line); border-radius: 12px; }
.scene svg { display: block; }
.groups, .singles { zoom: 1.45; }
.labels { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.lab { position: relative; background: var(--paper); border: 2px solid var(--line); border-radius: 10px; padding: 8px 14px; font-size: 1.15rem; font-weight: 700; font-variant-numeric: tabular-nums; min-height: 48px; }
.lab.cross { border-color: var(--red); color: var(--muted); }
.lab.cross::after { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 3px; background: var(--red); transform: rotate(-8deg); border-radius: 2px; }
.lab.good { border-color: var(--green); background: var(--green-soft); }
.lab.bad { border-color: var(--red); background: var(--red-soft); }
.big-btn { background: var(--red); color: var(--on-red); border: none; border-radius: 999px; padding: 12px 28px; font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; }
.big-btn.alt { background: var(--sheet); color: var(--pen); border: 2px solid var(--pen); }
.wild { width: 100%; display: flex; align-items: center; justify-content: center; gap: 14px; background: var(--grass); border-radius: 14px; padding: 8px 14px; min-height: 96px; }
.wild .cr { flex: none; transition: transform .45s, opacity .45s; }
.wild.caught .cr { transform: scale(.15) translateY(40px) rotate(180deg); opacity: 0; }
.wild.flee .cr { transform: translateX(90px); opacity: 0; }
.wild p { margin: 0; font-weight: 700; }
.wild p small { font-weight: 400; color: var(--muted); }
.parade { display: flex; gap: 4px; align-items: flex-end; }
.catch-list { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.dex { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
.review h3 small, .review h4 small { font-family: var(--font-body); font-weight: 400; color: var(--muted); font-size: .85rem; }
.review h4 { font-family: var(--font-display); font-size: 1.05rem; margin: 10px 0 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px; border-radius: 14px; border: 2px solid var(--line); background: var(--paper); text-align: center; transition: border-color .15s, transform .15s; }
.tile:hover { transform: translateY(-2px); }
.tile strong { font-family: var(--font-display); font-size: 1rem; line-height: 1.15; }
.tile small { color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.on { border-color: var(--pen); background: var(--grass); box-shadow: 0 4px 0 var(--pen); }
.tile .unknown svg { filter: brightness(0); opacity: .25; }
.only { display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; padding: 4px 0; }
.only input { width: 22px; height: 22px; accent-color: var(--pen); }
.more { display: block; margin: 12px auto 0; font-size: 1rem; }
.loader {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: var(--paper); background-image: radial-gradient(var(--dot) 1.6px, transparent 1.8px); background-size: 24px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity .4s;
}
.loader.done { opacity: 0; pointer-events: none; }
.loader-box { width: min(420px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.loader-box p { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
.loader-ball { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(var(--red) 50%, var(--sheet) 50%); border: 4px solid var(--ink); animation: hop .7s ease-in-out infinite alternate; }
@keyframes hop { to { transform: translateY(-16px) rotate(20deg); } }
.loader-bar { width: 100%; height: 18px; border-radius: 999px; background: var(--sheet); border: 2px solid var(--line); overflow: hidden; position: relative; }
.loader-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--pen), var(--sun)); border-radius: 999px; transition: width .2s; }
.loader-fill.indeterminate { width: 35%; position: absolute; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { from { left: -35%; } to { left: 100%; } }
@media (prefers-reduced-motion: reduce) { .loader-ball, .loader-fill.indeterminate { animation: none; } }
.music-btn {
  position: fixed; z-index: 20;
  right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--sheet); color: var(--pen); border: 2px solid var(--pen); border-radius: 999px;
  padding: 6px 14px; font-weight: 700; font-size: .85rem; box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.music-btn[aria-pressed="false"] { color: var(--muted); border-color: var(--line); }
.title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.title-row .mini { flex: none; font-size: .8rem; padding: 4px 10px; margin-top: 6px; }
.mini-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.admin { display: flex; flex-direction: column; gap: 16px; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; font-weight: 700; }
.field input { font: inherit; font-size: 1.2rem; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); width: 100%; max-width: 160px; font-variant-numeric: tabular-nums; }
.field input:focus { outline: 3px solid var(--pen); outline-offset: 1px; }
.field small { font-weight: 400; color: var(--muted); }
.check { display: flex; align-items: center; gap: 8px; font-weight: 700; align-self: end; padding-bottom: 6px; }
.check input, .tchip input { width: 20px; height: 20px; accent-color: var(--pen); }
.lbl { margin: 0; font-weight: 700; }
.tables { display: flex; flex-wrap: wrap; gap: 8px; }
.tchip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--paper); font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.tchip:has(input:checked) { border-color: var(--pen); background: var(--pen-soft); }
.saved { margin: 0; color: var(--green); font-weight: 700; }
.title-row + .top { margin-top: -12px; align-items: flex-end; }
.title-row + .top .lead { margin: 0; flex: 1; min-width: 220px; }
.who { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.who span { font-size: 1.1rem; margin-right: auto; }
.pseudo { background: var(--sheet); border: 2px solid var(--line); border-top: 8px solid var(--sun); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.pseudo label { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; }
.pseudo .row { display: flex; gap: 10px; flex-wrap: wrap; }
.pseudo input { flex: 1; min-width: 0; font: inherit; font-size: 1.2rem; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); }
.pseudo input:focus { outline: 3px solid var(--pen); outline-offset: 1px; }
.err { margin: 0; color: var(--red); font-weight: 700; }
.players { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.player strong { overflow-wrap: anywhere; font-size: 1.5rem; }
.who-cell { font-weight: 700; }
.cbox { display: flex; flex-direction: column; align-items: center; font-size: .75rem; }
.cbox b { color: var(--red); }
.dex > div { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--grass); border-radius: 12px; padding: 8px; font-size: .9rem; text-align: center; }
.dex small { color: var(--muted); }
.dex .unknown svg { filter: brightness(0); opacity: .25; }

/* Résultat */
.result { background: var(--sheet); border: 2px dashed var(--muted); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.score-ring { width: 120px; height: 120px; border: 4px solid var(--ink); border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; color: var(--pen); font-variant-numeric: tabular-nums; }
.score-ring small { display: block; font-size: .9rem; color: var(--muted); margin-top: -12px; }
.belt-big { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.belt-big .sw { width: 140px; height: 22px; border-radius: 5px; }
.actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.review { background: var(--sheet); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.review h3 { font-size: 1.1rem; }
.review ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px 14px; font-variant-numeric: tabular-nums; }
.review li.ko { color: var(--red); }
.review li.ok { color: var(--green); }
.review li s { color: var(--muted); }
.review p { margin: 0; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.top .big-btn { font-size: 1.05rem; padding: 8px 18px; }
.rank { margin: 0; font-weight: 700; color: var(--pen); }
.rank-none { margin: 0; color: var(--muted); }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px 8px; border-bottom: 2px solid var(--line); }
td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td small { color: var(--muted); }
td.pl { font-family: var(--font-display); font-weight: 800; color: var(--pen); }
tbody tr:first-child td { background: var(--pen-soft); }
.aw { display: inline-flex; align-items: center; gap: 6px; }
.aw .sw { width: 26px; height: 10px; }
.none { color: var(--muted); }
.empty { color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<!-- Écran de chargement : affiché tout de suite, avant que le reste (musiques) n'arrive -->
<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="loader-box">
    <div class="loader-ball" aria-hidden="true"></div>
    <h1>Défi <span>2 minutes</span></h1>
    <div class="loader-bar"><div class="loader-fill indeterminate" id="loader-fill"></div></div>
    <p id="loader-text">Chargement…</p>
    <button class="ghost mini" id="loader-skip" hidden>Jouer sans attendre la musique</button>
  </div>
</div>
<div class="wrap" id="app"></div>
<audio id="bgm" data-src="musique.mp3" loop preload="auto"></audio>
<audio id="bgm-jeu" data-src="musique-jeu.mp3" loop preload="auto"></audio>
<button class="music-btn" id="music-btn" aria-pressed="true">♪ Musique : oui</button>

<script>
const DUREE = 120;
const BELTS = [
  { min: 0,  name: "Blanche", color: "#ffffff" },
  { min: 5,  name: "Blanche / Jaune", color: "linear-gradient(90deg,#ffffff 50%,#f4d03f 50%)" },
  { min: 10, name: "Jaune",   color: "#f4d03f" },
  { min: 15, name: "Orange",  color: "#ef8a2c" },
  { min: 20, name: "Verte",   color: "#3a9b4f" },
  { min: 25, name: "Bleue",   color: "#2f6fcf" },
  { min: 30, name: "Rouge",   color: "#d23b34" },
  { min: 35, name: "Noire",   color: "#111111" },
];
const RANGES = ["jusqu'à 4", "5 à 9", "10 à 14", "15 à 19", "20 à 24", "25 à 29", "30 à 34", "35 et +"];
const belt = n => BELTS.filter(b => n >= b.min).pop();
const app = document.getElementById("app");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const MEDALS = [
  { min: 13, name: "Médaille d'or",    short: "Or",     color: "#e2b33c", range: "13 et +" },
  { min: 9,  name: "Médaille d'argent", short: "Argent", color: "#b9c0c9", range: "9 à 12" },
  { min: 6,  name: "Médaille de bronze", short: "Bronze", color: "#c47e45", range: "6 à 8" },
];
const medal = (n, table = MEDALS) => table.find(m => n >= m.min) || null;
const medalSVG = (m, size = 64) => `<svg width="${size}" height="${size * 1.3}" viewBox="0 0 50 65" aria-hidden="true"><path d="M14 0 L22 22 L28 22 L20 0 Z" fill="#c8332f"/><path d="M36 0 L28 22 L22 22 L30 0 Z" fill="#2f6fcf"/><circle cx="25" cy="42" r="20" fill="${m.color}" stroke="rgba(0,0,0,.25)" stroke-width="2"/><circle cx="25" cy="42" r="14" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2"/><path d="M25 32 l3 6.5 7 .8 -5.2 4.8 1.4 7 -6.2-3.5 -6.2 3.5 1.4-7 -5.2-4.8 7-.8z" fill="rgba(255,255,255,.75)"/></svg>`;

/* ---------- Créatures (dessins originaux) : 500 espèces × 3 stades = 1500 ---------- */
const TYPES = [
  { root: "Flam",  hue: 16,  sat: 85, top: "flame" },
  { root: "Goutt", hue: 205, sat: 75, top: "drop" },
  { root: "Feuil", hue: 115, sat: 55, top: "leaf" },
  { root: "Zap",   hue: 48,  sat: 95, top: "bolt" },
  { root: "Roc",   hue: 28,  sat: 22, top: "rock" },
  { root: "Plum",  hue: 330, sat: 65, top: "wing" },
  { root: "Glac",  hue: 186, sat: 60, top: "ice" },
  { root: "Ombr",  hue: 262, sat: 45, top: "ghost" },
  { root: "Champ", hue: 4,   sat: 70, top: "mush" },
  { root: "Poil",  hue: 36,  sat: 50, top: "ears" },
  { root: "Sabl",  hue: 42,  sat: 55, top: "sand" },
  { root: "Dard",  hue: 80,  sat: 60, top: "bug" },

const U = ["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
const T = { 2: "vingt", 3: "trente", 4: "quarante", 5: "cinquante", 6: "soixante" };
function lettres(n) {
  if (n < 17) return U[n];
  if (n < 20) return "dix-" + U[n - 10];
  const t = Math.floor(n / 10), u = n % 10;
  if (t === 7) return n === 71 ? "soixante et onze" : "soixante-" + lettres(n - 60);
  if (t === 9) return "quatre-vingt-" + lettres(n - 80);
  if (t === 8) return u === 0 ? "quatre-vingts" : "quatre-vingt-" + U[u];

// "menu" : musique des menus ; "jeu" : musique du chrono, depuis le début ; "silence" : rien (bips et gong)
function musicMode(mode) {
  clearTimeout(musicTimer);
  if (mode === "silence") { bgmMenu.pause(); bgmJeu.pause(); bgm = null; return; }
  if (mode === "jeu") { bgmMenu.pause(); bgmJeu.currentTime = 0; bgm = bgmJeu; playMusic(); return; }
  bgmJeu.pause(); bgm = bgmMenu;
  const wait = Math.max(0, gongAt + 4000 - Date.now());   // laisse le gong résonner avant de reprendre
  if (wait) { bgm = null; musicTimer = setTimeout(() => { bgm = bgmMenu; playMusic(); }, wait); } else playMusic();
}

/* ---------- Chargement des musiques, avec barre de progression ---------- */
async function loadAudio() {
  const fill = document.getElementById("loader-fill"), text = document.getElementById("loader-text");
  const loaded = [0, 0], totals = [0, 0];
  const show = () => {
    if (!totals[0] || !totals[1]) return;   // taille inconnue : la barre reste animée
    const p = Math.min(100, Math.round((loaded[0] + loaded[1]) * 100 / (totals[0] + totals[1])));
    fill.classList.remove("indeterminate"); fill.style.width = p + "%";
    text.textContent = `Chargement de la musique… ${p} %`;
  };
  const one = async (el, i) => {
    const url = el.dataset.src;
    try {
      const res = await fetch(url);
      if (!res.ok || !res.body) throw new Error("lecture impossible");
      totals[i] = Number(res.headers.get("content-length")) || 0;
      const reader = res.body.getReader(), parts = [];
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        parts.push(value); loaded[i] += value.length; show();
      }
      el.src = URL.createObjectURL(new Blob(parts, { type: "audio/mpeg" }));
    } catch (e) { el.src = url; }   // sans suivi possible (ex. fichier ouvert en local) : le navigateur charge lui-même
  };
  await Promise.all([bgmMenu, bgmJeu].map(one));
}
function hideLoader() {

  if (l.classList.contains("done")) return;
  l.classList.add("done"); setTimeout(() => { l.hidden = true; }, 450);

// Petit bip léger pour le compte à rebours
function bip() {
  if (!audio) return;
  const now = audio.currentTime + 0.01, osc = audio.createOscillator(), g = audio.createGain();
  osc.type = "sine"; osc.frequency.value = 880;
  g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.12, now + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
  osc.connect(g); g.connect(audio.destination); osc.start(now); osc.stop(now + 0.2);
}
// Bonne réponse : petit arpège de harpe (do – mi – sol – do)
function harpe() {
  if (!audio) return;
  const t0 = audio.currentTime + 0.01;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => {
    const t = t0 + i * 0.07;
    [[1, "triangle", 0.16], [2, "sine", 0.05], [3, "sine", 0.02]].forEach(([k, type, v]) => {   // fondamentale + harmoniques
      const osc = audio.createOscillator(), g = audio.createGain();
      osc.type = type; osc.frequency.value = f * k;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1 / k);
      osc.connect(g); g.connect(audio.destination); osc.start(t); osc.stop(t + 1.2);
    });
  });
}
// Mauvaise réponse : buzz grave et court
function buzz() {
  if (!audio) return;
  const t = audio.currentTime + 0.01, lp = audio.createBiquadFilter(), g = audio.createGain();
  lp.type = "lowpass"; lp.frequency.value = 900;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.18, t + 0.02);
  g.gain.setValueAtTime(0.18, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
  lp.connect(g); g.connect(audio.destination);
  [110, 116].forEach(f => {   // deux notes un peu fausses = effet « bzzz »
    const osc = audio.createOscillator(); osc.type = "sawtooth"; osc.frequency.value = f;
    osc.connect(lp); osc.start(t); osc.stop(t + 0.45);
  });
}
function startTimer(onEnd) {
  unlockAudio();
  musicMode("jeu");
  let lastBip = 4;
  const t0 = performance.now();
  clearInterval(timer);
  timer = setInterval(() => {
    const left = Math.max(0, DUREE - (performance.now() - t0) / 1000);
    const s = Math.ceil(left);
    const el = document.getElementById("clock");
    if (!el) return clearInterval(timer);
    el.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    document.getElementById("prog").setAttribute("stroke-dashoffset", (213.6 * (1 - left / DUREE)).toFixed(1));
    document.getElementById("timer").classList.toggle("low", left <= 15);
    if (s >= 1 && s <= 3 && s < lastBip) { if (lastBip === 4) musicMode("silence"); lastBip = s; bip(); }   // bips à 3, 2 et 1 seconde
    if (left <= 0) { clearInterval(timer); gongAt = Date.now(); gong(); onEnd(); }
  }, 200);
}

/* ---------- Calcul mental ---------- */
/* ---------- Réglages (page Administration) ---------- */
const SETTINGS_KEY = "defi2min-reglages";
const DEFAULTS = {
  calc: { cible: 10, addMax: 9 },
  sous: { max: 10, zero: false },
  mult: { tables: [2, 3], multMax: 10 },
  num:  { min: 21, max: 99 },
};
function loadSettings() {
  let s = {};
  try { s = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {}; } catch (e) {}
  const out = {};
  Object.keys(DEFAULTS).forEach(k => out[k] = { ...DEFAULTS[k], ...(s[k] || {}) });
  return out;
}
let settings = loadSettings();

function makeCalc(prev) {
  const { cible: C, addMax } = settings.calc;
  let q, tries = 0;
  do {
    const r = Math.random();
    if (r < 0.4) { const a = rnd(1, C - 1); q = { a, op: "+", b: C - a }; }
    else if (r < 0.75) { const b = rnd(0, C); q = { a: C, op: "−", b }; }
    else { q = { a: rnd(2, addMax), op: "+", b: rnd(2, addMax) }; }
    q.res = q.op === "+" ? q.a + q.b : q.a - q.b;
  } while (prev && prev.a === q.a && prev.b === q.b && prev.op === q.op && ++tries < 20);
  q.cr = pickCreature(prev ? Math.floor(prev.cr / 3) : -1);
  return q;
}
/* ---------- Soustractions CE1 ---------- */
function makeSous(prev) {
  const { max: M, zero } = settings.sous;
  let q, tries = 0;
  do {
    // Tous les nombres restent entre 0 et le maximum choisi (au plus M − M)
    const a = rnd(2, M), b = rnd(zero ? 0 : 1, a);
    q = { a, op: "−", b, res: a - b };
  } while (prev && prev.a === q.a && prev.b === q.b && ++tries < 20);
  q.cr = pickCreature(prev ? Math.floor(prev.cr / 3) : -1);
  return q;
}
/* ---------- Multiplications : tables de 2 et de 3 ---------- */
function makeMult(prev) {
  const { tables, multMax } = settings.mult;
  let q, tries = 0;
  do {
    const n = rnd(1, multMax), t = tables[rnd(0, tables.length - 1)];
    q = Math.random() < 0.5 ? { a: n, op: "×", b: t, res: n * t } : { a: t, op: "×", b: n, res: n * t };
  } while (prev && prev.a === q.a && prev.b === q.b && ++tries < 20);
  q.cr = pickCreature(prev ? Math.floor(prev.cr / 3) : -1);
  return q;
}
const GAMES = {
  calc: { title: "Calcul mental", gen: makeCalc },
  sous: { title: "Soustractions", gen: makeSous },
  mult: { title: "Multiplications", gen: makeMult, medals: true },
  // Calcul mental + : mélange des calculs de « Calcul mental » et de « Multiplications »
  plus: { title: "Calcul mental +", gen: prev => (Math.random() < 0.5 ? makeCalc : makeMult)(prev) },
};
function calcGame(kind = "calc") {
  if (typeof kind !== "string") kind = "calc";
  const G = GAMES[kind], makeCalc = G.gen;
  const hist = []; let cur = makeCalc(), typed = "", locked = false;
  app.innerHTML = `
    <div class="bar">${timerHTML()}<div class="info"><h2>${G.title}</h2><div id="count">0 bonne réponse</div></div><button class="ghost" id="stop">Arrêter</button></div>
    <div class="card" id="card">
      <div class="wild" id="wild"></div>
      <div class="calc"><span id="qtxt"></span><span>=</span><span class="answer" id="ans"></span><span class="fix" id="fix"></span></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button class="del" data-k="del">Effacer</button><button data-k="0">0</button><button class="ok-btn" data-k="ok">OK</button></div>
      <p class="hint">Tu peux aussi taper au clavier puis appuyer sur Entrée.</p>
    </div>`;
  const show = () => { document.getElementById("qtxt").textContent = `${cur.a} ${cur.op} ${cur.b}`; document.getElementById("ans").textContent = typed; };
  const count = () => { const n = hist.filter(h => h.ok).length; document.getElementById("count").textContent = `${n} bonne${n > 1 ? "s" : ""} réponse${n > 1 ? "s" : ""} · ${hist.length} calcul${hist.length > 1 ? "s" : ""}`; };
  const key = k => {
    if (locked) return;
    if (k === "del") typed = typed.slice(0, -1);
    else if (k === "ok") {
      if (!typed) return;
      const ok = Number(typed) === cur.res; hist.push({ ...cur, given: Number(typed), ok, isNew: ok && addCatch(cur.cr) }); count();
      const card = document.getElementById("card"); card.classList.add(ok ? "ok" : "ko");
      if (!ok) document.getElementById("fix").textContent = cur.res;
      wildEnd(ok, cur.cr); (ok ? harpe : buzz)();
      locked = true;
      setTimeout(() => { if (!document.getElementById("card")) return; card.classList.remove("ok", "ko"); document.getElementById("fix").textContent = ""; cur = makeCalc(cur); typed = ""; locked = false; showWild(); show(); }, ok ? 650 : 1200);
    } else if (typed.length < 3) typed += k;
    show();
  };
  app.querySelectorAll(".pad button").forEach(b => b.onclick = () => key(b.dataset.k));
  document.onkeydown = e => {
    if (/^[0-9]$/.test(e.key)) key(e.key);
    else if (e.key === "Backspace") key("del");
    else if (e.key === "Enter") { e.preventDefault(); key("ok"); }
  };
  const showWild = () => { const w = document.getElementById("wild"); w.className = "wild"; w.innerHTML = wildHTML(cur.cr); };
  document.getElementById("stop").onclick = () => endCalc(hist, kind);
  showWild(); show(); startTimer(() => endCalc(hist, kind));
}
function endCalc(hist, kind) {
  clearInterval(timer); document.onkeydown = null; musicMode("menu");
  const good = hist.filter(h => h.ok).length, b = belt(good), m = medal(good);
  const rank = hist.length ? addScore(kind, good, hist.length) : null;
  const award = !GAMES[kind].medals
    ? `<div class="belt-big"><span class="sw" style="background:${b.color}"></span><strong>Ceinture obtenue : ${b.name}</strong></div>`
    : m ? `<div class="belt-big">${medalSVG(m)}<strong>${m.name} !</strong></div>` : `<p class="rank-none">Pas encore de médaille : il faut 6 bonnes réponses pour le bronze.</p>`;
  app.innerHTML = `
    <div class="result">
      <h2>Score</h2>
      <div class="score-ring"><div>${good}<small>/ ${hist.length}</small></div></div>
      ${award}
      ${rankMsg(rank)}
      <div class="actions"><button class="big-btn" id="again">Rejouer</button><button class="big-btn alt" id="scores">Meilleurs scores</button><button class="big-btn alt" id="back">Menu</button></div>
    </div>
    ${caughtHTML(hist)}
    ${hist.length ? `<section class="review"><h3>Correction</h3><ul>${hist.map(h => `<li class="${h.ok ? "ok" : "ko"}">${h.ok ? "✓" : "✗"} ${h.a} ${h.op} ${h.b} = ${h.ok ? h.res : `<s>${h.given}</s> ${h.res}`}</li>`).join("")}</ul></section>` : ""}`;
  document.getElementById("again").onclick = () => calcGame(kind);
  document.getElementById("scores").onclick = scoresPage;
  document.getElementById("back").onclick = menu;
}

/* ---------- Numération ---------- */
const THEMES = [
  { q: "Combien y a-t-il de billes ?", grp: "sacs de 10 billes", one: "billes isolées", draw: "sac" },
  { q: "Combien y a-t-il de cubes ?", grp: "barres de 10", one: "cubes isolés", draw: "barre" },
  { q: "Combien y a-t-il d'images ?", grp: "paquets de 10", one: "images isolées", draw: "paquet" },
  { q: "Combien y a-t-il de jetons ?", grp: "sacs de 10 jetons", one: "jetons isolés", draw: "sac" },
];
function svgGroup(kind) {
  if (kind === "barre") {
    let r = ""; for (let i = 0; i < 10; i++) r += `<rect x="2" y="${2 + i * 9}" width="16" height="8" rx="1.5" fill="var(--pen-soft)" stroke="var(--pen)" stroke-width="1.5"/>`;
    return `<svg width="20" height="94" viewBox="0 0 20 94" aria-hidden="true">${r}</svg>`;
  }
  if (kind === "paquet") {
    return `<svg width="46" height="56" viewBox="0 0 46 56" aria-hidden="true"><rect x="8" y="2" width="34" height="46" rx="4" fill="var(--pen-soft)" stroke="var(--pen)" stroke-width="1.5"/><rect x="4" y="6" width="34" height="46" rx="4" fill="var(--pen-soft)" stroke="var(--pen)" stroke-width="1.5"/><rect x="1" y="9" width="34" height="46" rx="4" fill="var(--sheet)" stroke="var(--pen)" stroke-width="2"/><text x="18" y="38" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="17" fill="var(--pen)">10</text></svg>`;
  }
  return `<svg width="50" height="58" viewBox="0 0 50 58" aria-hidden="true"><path d="M17 8 Q25 2 33 8 L30 14 Q44 22 44 38 Q44 55 25 55 Q6 55 6 38 Q6 22 20 14 Z" fill="var(--pen-soft)" stroke="var(--pen)" stroke-width="2"/><path d="M18 14 Q25 17 32 14" fill="none" stroke="var(--pen)" stroke-width="2"/><text x="25" y="44" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="16" fill="var(--pen)">10</text></svg>`;
}
function svgOne(kind) {
  if (kind === "barre") return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="2" fill="var(--pen-soft)" stroke="var(--pen)" stroke-width="1.5"/></svg>`;
  if (kind === "paquet") return `<svg width="16" height="20" viewBox="0 0 16 20" aria-hidden="true"><rect x="1" y="1" width="14" height="18" rx="2" fill="var(--sheet)" stroke="var(--pen)" stroke-width="1.5"/><circle cx="8" cy="10" r="3" fill="var(--pen)"/></svg>`;
  return `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="var(--pen-soft)" stroke="var(--pen)" stroke-width="1.5"/><circle cx="6" cy="6" r="1.6" fill="var(--sheet)"/></svg>`;
}
function wrongWords(n) {
  const t = Math.floor(n / 10), u = n % 10;
  if ((t === 7 || t === 9) && u > 0) return (t === 7 ? "soixante-dix-" : "quatre-vingt-dix-") + U[u];
  if (u > 0 && u !== t && u >= 2) return lettres(u * 10 + t);
  return lettres(n < 90 ? n + 10 : n - 10);
}
function makeNum() {
  const n = rnd(settings.num.min, settings.num.max), t = Math.floor(n / 10), u = n % 10;
  const split = u <= 6 && t >= 3 && Math.random() < 0.25;           // ex. 6 barres de 10 et 15 cubes
  const gT = split ? t - 1 : t, gU = split ? u + 10 : u;
  const vrais = [String(n), lettres(n), `${t}d ${u}u`, `${t * 10} + ${u}`];
  if (t >= 2 && (split || Math.random() < 0.4)) vrais.push(Math.random() < 0.5 ? `${(t - 1) * 10} + ${u + 10}` : `${t - 1}d ${u + 10}u`);
  if (Math.random() < 0.3) vrais.push(`${u}u ${t}d`);
  const faux = [];
  if (u > 0 && u !== t) faux.push(String(u * 10 + t), `${u}d ${t}u`, `${u * 10} + ${t}`);
  faux.push(wrongWords(n), String(n + (Math.random() < 0.5 ? 1 : -1)), `${t}d ${u === 9 ? u - 1 : u + 1}u`);
  if (t > 2) faux.push(`${(t - 1) * 10} + ${u + 2}`);
  const uniq = arr => [...new Set(arr)];
  const v = shuffle(uniq(vrais)).slice(0, rnd(3, 4));
  const f = shuffle(uniq(faux).filter(x => !vrais.includes(x))).slice(0, 7 - v.length);
  const labels = shuffle([...v.map(x => ({ txt: x, ok: true })), ...f.map(x => ({ txt: x, ok: false }))]);
  return { n, gT, gU, theme: THEMES[rnd(0, THEMES.length - 1)], labels, cr: pickCreature(-1) };
}
function numGame() {
  const hist = []; let cur, locked = false;
  app.innerHTML = `
    <div class="bar">${timerHTML()}<div class="info"><h2>Les nombres jusqu'à 99</h2><div id="count">0 exercice réussi</div></div><button class="ghost" id="stop">Arrêter</button></div>
    <div class="card" id="card"></div>`;
  const count = () => { const n = hist.filter(h => h.ok).length; document.getElementById("count").textContent = `${n} exercice${n > 1 ? "s" : ""} réussi${n > 1 ? "s" : ""} · ${hist.length} fait${hist.length > 1 ? "s" : ""}`; };
  const render = () => {
    cur = makeNum(); locked = false;
    const k = cur.theme.draw;
    document.getElementById("card").innerHTML = `
      <div class="wild" id="wild">${wildHTML(cur.cr)}</div>
      <div class="q">${cur.theme.q}<br><small style="color:var(--muted);font-family:var(--font-body);font-size:.95rem">Compte bien, puis barre les étiquettes fausses.</small></div>
      <div class="scene"><div class="groups">${svgGroup(k).repeat(cur.gT)}</div>${cur.gU ? `<div class="singles">${svgOne(k).repeat(cur.gU)}</div>` : ""}</div>
      <div class="labels">${cur.labels.map((l, i) => `<button class="lab" data-i="${i}" aria-pressed="false">${l.txt}</button>`).join("")}</div>
      <button class="big-btn" id="valid">Valider</button>`;
    document.querySelectorAll(".lab").forEach(b => b.onclick = () => {
      if (locked) return;
      const on = b.classList.toggle("cross"); b.setAttribute("aria-pressed", on);
    });
    document.getElementById("valid").onclick = validate;
  };
  const validate = () => {
    if (locked) return; locked = true;
    let ok = true;
    document.querySelectorAll(".lab").forEach(b => {
      const l = cur.labels[b.dataset.i], crossed = b.classList.contains("cross");
      const right = crossed !== l.ok;
      if (!right) ok = false;
      b.classList.add(right ? "good" : "bad");
    });
    hist.push({ n: cur.n, ok, cr: cur.cr, isNew: ok && addCatch(cur.cr), faux: cur.labels.filter(l => !l.ok).map(l => l.txt) }); count();
    wildEnd(ok, cur.cr); (ok ? harpe : buzz)();
    document.getElementById("card").classList.add(ok ? "ok" : "ko");
    const v = document.getElementById("valid"); v.textContent = "Suivant"; v.onclick = next;
    locked = true;
    if (ok) setTimeout(next, 900);
  };
  const next = () => { const c = document.getElementById("card"); if (!c) return; c.classList.remove("ok", "ko"); render(); };
  document.getElementById("stop").onclick = () => endNum(hist);
  render(); startTimer(() => endNum(hist));
}
function endNum(hist) {
  clearInterval(timer); musicMode("menu");
  const good = hist.filter(h => h.ok).length;
  const rank = hist.length ? addScore("num", good, hist.length) : null, m = medal(good);  app.innerHTML = `
    <div class="result">
      <h2>Score</h2>
      <div class="score-ring"><div>${good}<small>/ ${hist.length}</small></div></div>
      <strong>${good} exercice${good > 1 ? "s" : ""} réussi${good > 1 ? "s" : ""} sans erreur</strong>
      ${m ? `<div class="belt-big">${medalSVG(m)}<strong>${m.name} !</strong></div>` : `<p class="rank-none">Pas encore de médaille : il faut 6 exercices justes pour le bronze.</p>`}
      ${rankMsg(rank)}
      <div class="actions"><button class="big-btn" id="again">Rejouer</button><button class="big-btn alt" id="scores">Meilleurs scores</button><button class="big-btn alt" id="back">Menu</button></div>
    </div>
    ${caughtHTML(hist)}
    ${hist.length ? `<section class="review"><h3>Correction</h3>${hist.map(h => `<p class="${h.ok ? "ok" : "ko"}" style="color:var(--${h.ok ? "green" : "red"})">${h.ok ? "✓" : "✗"} <strong>${h.n}</strong> · étiquettes fausses : ${h.faux.join(" ; ")}</p>`).join("")}</section>` : ""}`;
  document.getElementById("again").onclick = numGame;
  document.getElementById("scores").onclick = scoresPage;
  document.getElementById("back").onclick = menu;
}

// Au lancement, on arrive toujours sur le choix du joueur.
if (!(player && loadPlayers().list.includes(player))) player = null;
playersPage();
